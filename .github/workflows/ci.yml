name: CI

on:
  push:
    branches: [main, sih-hardening]
  pull_request:
    branches: [main]

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Correlation and detector guardrail tests
        working-directory: backend
        run: pytest -q tests/test_correlation_golden.py tests/test_sar_segmentation_runtime.py tests/test_sar_aoi_window.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: yarn build

  sar-v2-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          pip install "numpy>=1.26,<3" pytest pytest-xdist python-dotenv

      - name: Load a temporary v2 checkpoint and test promotion gate
        working-directory: backend
        run: pytest -q tests/test_sar_segmentation_v2_smoke.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create local configuration
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..36}; do
            if curl --fail --silent http://localhost:8000/api/ >/dev/null && curl --fail --silent http://localhost:3000/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
